version: '3.8'

services:
  backend:
    build: 
      context: ./equity-research-backend
    ports:
      - "8000:8000"
    env_file:
      - ./equity-research-backend/.env
    volumes:
      - ./equity-research-backend:/app

  frontend:
    build:
      context: ./equity-research-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./equity-research-frontend:/app
      - /app/node_modules
    command: npm run dev
